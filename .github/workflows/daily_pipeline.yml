name: DealPulse Automated M&A Pipeline

on:
  schedule:
    # Run every weekday at 06:00 UTC (matching London business hours opening)
    - cron: '0 6 * * 1-5'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-run:
    name: Test, Ingest & Export M&A Deals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quality Assurance & Unit Tests
        run: |
          pytest tests/ -v

      - name: Execute Ingestion Pipeline
        run: |
          chmod +x scripts/run_pipeline.sh
          ./scripts/run_pipeline.sh

      - name: Archive Curated Data Exports
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-curated-mna-data
          path: data/exports/
          retention-days: 14
